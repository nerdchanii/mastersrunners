name: PR AI Review Gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to refresh"
        required: true
        type: string

concurrency:
  group: pr-ai-review-gate-${{ github.event.pull_request.number || github.event.pull_request_review.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow support
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Derive AI review gate state
        id: gate
        uses: actions/github-script@v7
        env:
          HELPER_PATH: ${{ github.workspace }}/.github/scripts/pr-autofix-state.cjs
          GEMINI_REVIEW_LOGIN: ${{ vars.GEMINI_REVIEW_LOGIN }}
          GEMINI_REVIEW_MARKER: ${{ vars.GEMINI_REVIEW_MARKER }}
          STATE_MARKER: "<!-- codex-pr-fix-state -->"
          FIX_LABEL: ai-fix
          MAX_ITERATIONS: "5"
        with:
          script: |
            const {
              currentHeadReviewReady,
              findStateComment,
              latestCommand,
              parseControlCommand,
              parsePositiveInt,
              parseState,
              renderState,
            } = require(process.env.HELPER_PATH);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventName = context.eventName;
            const fixLabel = process.env.FIX_LABEL;
            const stateMarker = process.env.STATE_MARKER;
            const maxIterations = Number(process.env.MAX_ITERATIONS || "5");
            const geminiLogin = (process.env.GEMINI_REVIEW_LOGIN || "").trim().toLowerCase();
            const geminiMarker = (process.env.GEMINI_REVIEW_MARKER || "").trim();

            async function loadPullRequest() {
              if (eventName === "workflow_dispatch") {
                const prNumber = parsePositiveInt(context.payload.inputs?.pr_number);
                if (!prNumber) {
                  core.setFailed("workflow_dispatch requires a positive integer pr_number input.");
                  return null;
                }

                const response = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber,
                });
                return response.data;
              }

              if (eventName === "issue_comment") {
                if (!context.payload.issue?.pull_request) {
                  return null;
                }

                const response = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: context.payload.issue.number,
                });
                return response.data;
              }

              if (eventName === "pull_request_review") {
                return context.payload.pull_request;
              }

              return context.payload.pull_request;
            }

            function currentCommentCommand() {
              if (eventName !== "issue_comment") {
                return "";
              }

              const comment = context.payload.comment;
              if (!comment?.body) {
                return "";
              }

              const allowedAssociations = new Set(["OWNER"]);
              if (!allowedAssociations.has(comment.author_association)) {
                return "";
              }

              return parseControlCommand(comment.body);
            }

            const pr = await loadPullRequest();

            if (!pr) {
              core.info("No PR context for this event.");
              return;
            }

            if (pr.base.ref !== "dev") {
              core.info(`PR #${pr.number} does not target dev.`);
              return;
            }

            const issueComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const stateComment = findStateComment(issueComments, stateMarker);
            const state = parseState(stateComment?.body || "", stateMarker);
            const lastCommand = latestCommand(issueComments);
            const currentCommand = currentCommentCommand();
            const ownerTriggeredLabelAction =
              eventName === "pull_request_target" && context.payload.sender?.login === owner;
            const labeledNow =
              ownerTriggeredLabelAction &&
              context.payload.action === "labeled" &&
              context.payload.label?.name === fixLabel;
            const unlabeledNow =
              ownerTriggeredLabelAction &&
              context.payload.action === "unlabeled" &&
              context.payload.label?.name === fixLabel;
            const explicitFixRequestedNow = labeledNow || currentCommand === "fix";
            const explicitStopRequestedNow = currentCommand === "stop";
            const explicitSkipRequestedNow = currentCommand === "skip";
            const forkBlocked = pr.head.repo.full_name !== `${owner}/${repo}`;
            const branchResponse =
              forkBlocked
                ? { data: { protected: false } }
                : await github.rest.repos.getBranch({
                    owner,
                    repo,
                    branch: pr.head.ref,
                  });
            const headBranchProtected =
              ["main", "dev"].includes(pr.head.ref) || Boolean(branchResponse.data?.protected);

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const geminiIdentityConfigured = Boolean(geminiLogin || geminiMarker);
            const geminiReady = currentHeadReviewReady(reviews, pr.head.sha, geminiLogin, geminiMarker);
            const autoEnableOnReviewNow =
              eventName === "pull_request_review" &&
              pr.author_association === "OWNER" &&
              !forkBlocked &&
              !headBranchProtected &&
              geminiReady;

            let enabled = Boolean(state.enabled);
            if (unlabeledNow || explicitStopRequestedNow || explicitSkipRequestedNow) {
              enabled = false;
            } else if (labeledNow || explicitFixRequestedNow || autoEnableOnReviewNow) {
              enabled = true;
            }

            const stateMatchesHead = state.head_sha === pr.head.sha;
            const preserveRunning = stateMatchesHead && state.status === "running";
            const preserveTerminal =
              stateMatchesHead &&
              ["succeeded", "no_changes", "failed", "retry_required"].includes(state.status) &&
              !explicitFixRequestedNow;

            let status = "paused";
            if (forkBlocked) {
              status = "fork_blocked";
            } else if (pr.author_association !== "OWNER") {
              status = "untrusted_pr_author";
            } else if (headBranchProtected) {
              status = "protected_or_shared_head_branch";
            } else if (!enabled) {
              status = "paused";
            } else if (state.iteration >= maxIterations && !explicitFixRequestedNow) {
              status = "max_iterations_reached";
            } else if (!geminiIdentityConfigured) {
              status = "waiting_for_gemini_identity";
            } else if (!geminiReady) {
              status = "waiting_for_gemini_review";
            } else if (preserveRunning) {
              status = "running";
            } else if (preserveTerminal) {
              status = state.status;
            } else {
              status = "waiting_for_connector_fix";
            }

            const nextState = {
              ...state,
              enabled,
              executor: "chatgpt_codex_connector",
              status,
              pr_number: pr.number,
              base_ref: pr.base.ref,
              head_ref: pr.head.ref,
              head_sha: pr.head.sha,
              max_iterations: maxIterations,
              gemini_identity_configured: geminiIdentityConfigured,
              gemini_review_ready: geminiReady,
              latest_command: currentCommand || lastCommand || "",
              last_skip_sha:
                explicitSkipRequestedNow ? pr.head.sha : state.last_skip_sha || "",
              last_stop_sha:
                explicitStopRequestedNow ? pr.head.sha : state.last_stop_sha || "",
              updated_at: new Date().toISOString(),
            };

            if (labeledNow || explicitFixRequestedNow || autoEnableOnReviewNow) {
              if (nextState.last_skip_sha === pr.head.sha) {
                nextState.last_skip_sha = "";
              }
              if (nextState.last_stop_sha === pr.head.sha) {
                nextState.last_stop_sha = "";
              }
              if (status === "waiting_for_connector_fix") {
                nextState.last_requested_sha = pr.head.sha;
                nextState.last_requested_at = new Date().toISOString();
                nextState.last_result = "waiting_for_connector_fix";
              }
            }

            const body = renderState(nextState, stateMarker);

            if (stateComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: stateComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body,
              });
            }

            core.setOutput("pr_number", String(pr.number));
            core.setOutput("head_ref", pr.head.ref);
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("status", status);

      - name: Refresh merge readiness workflow
        if: steps.gate.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "pr-merge-readiness.yml",
              ref: "${{ steps.gate.outputs.head_ref }}",
              inputs: {
                pr_number: "${{ steps.gate.outputs.pr_number }}",
              },
            });

      - name: Refresh status workflow after gate update
        if: always() && steps.gate.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "codex-pr-fix-status.yml",
              ref: "${{ steps.gate.outputs.head_ref }}",
              inputs: {
                pr_number: "${{ steps.gate.outputs.pr_number }}",
              },
            });
