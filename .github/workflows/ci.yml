name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: http://localhost:4000/api/v1

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: masters
          POSTGRES_PASSWORD: masters
          POSTGRES_DB: masters_runners_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Check harness structure
        run: |
          test -f AGENTS.md
          test -d design
          test -d docs
          test -d tasks
          bash scripts/check-generated-artifacts.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @masters/web exec playwright install --with-deps chromium

      - name: Run format check
        run: pnpm format:check

      - name: Run lint
        run: pnpm lint

      - name: Check first-wave UX copy guardrails
        run: pnpm check:ux-copy

      - name: Run explicit typecheck
        run: pnpm typecheck

      - name: Check reviewer protocols
        run: bash scripts/check-reviewer-protocols.sh

      - name: Check reviewer protocol wiring
        run: bash scripts/check-reviewer-protocol-wiring.sh

      - name: Check task review metadata for active and todo tasks
        run: bash scripts/check-task-review-metadata.sh

      - name: Check deterministic active-task closeout state
        run: bash scripts/check-active-task-closeout.sh

      - name: Check Codex Stop review hook smoke scenarios
        run: bash scripts/check-codex-stop-review-hook.sh

      - name: Check dependency boundaries and cycles
        run: pnpm depcruise

      - name: Check dead code baseline
        run: pnpm knip

      - name: Build packages
        run: pnpm -r run build

      - name: Run API coverage
        run: pnpm --filter @masters/api test:cov
        env:
          DATABASE_URL: postgresql://masters:masters@localhost:5432/masters_runners_test
          JWT_SECRET: test-secret
          JWT_ACCESS_TTL: 900
          JWT_REFRESH_TTL: 604800
          REDIS_URL: redis://localhost:6379

      - name: Build web
        run: pnpm --filter @masters/web build

      - name: Run public web UX contracts
        run: pnpm --filter @masters/web exec playwright test e2e/public-entry-auth.spec.ts e2e/ux-contract.spec.ts --project=chromium

      - name: Build ops web
        run: pnpm --filter @masters/ops-web build

  build-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: masters-runners-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test Docker runtime
        run: |
          docker run --rm -d \
            --name masters-runners-api-smoke \
            -p 4000:4000 \
            -e NODE_ENV=production \
            -e FRONTEND_URL=http://localhost:3000 \
            -e KAKAO_CLIENT_ID=ci-kakao-client \
            -e KAKAO_CLIENT_SECRET=ci-kakao-secret \
            -e KAKAO_CALLBACK_URL=http://localhost:4000/api/v1/auth/kakao/callback \
            -e JWT_SECRET=ci-jwt-secret \
            -e DATABASE_URL=postgresql://masters:masters@localhost:5432/masters_runners_test \
            masters-runners-api:test
          trap 'docker logs masters-runners-api-smoke || true; docker stop masters-runners-api-smoke || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:4000/api/v1/health > /tmp/api-health.json; then
              cat /tmp/api-health.json
              exit 0
            fi
            sleep 1
          done

          echo "API Docker runtime did not become healthy."
          exit 1
