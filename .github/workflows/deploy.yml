name: Deploy

on:
  push:
    branches: [dev, main]

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}

    env:
      DEPLOY_LANE: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      SERVICE_NAME: ${{ vars.CLOUD_RUN_SERVICE_NAME }}
      REGION: asia-northeast3
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      API_PUBLIC_URL: ${{ vars.API_PUBLIC_URL }}
      KAKAO_CALLBACK_URL: ${{ vars.KAKAO_CALLBACK_URL }}
      GOOGLE_CALLBACK_URL: ${{ vars.GOOGLE_CALLBACK_URL }}
      NAVER_CALLBACK_URL: ${{ vars.NAVER_CALLBACK_URL }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate branch deploy env contract
        run: |
          if [ -z "${SERVICE_NAME}" ]; then
            echo "::error::GitHub environment variable CLOUD_RUN_SERVICE_NAME must be set for ${DEPLOY_LANE} deploys."
            exit 1
          fi
          if [ -z "${FRONTEND_URL}" ]; then
            echo "::error::GitHub environment variable FRONTEND_URL must be set for ${DEPLOY_LANE} Cloud Run deploys."
            exit 1
          fi

      - name: Check automated migration safety
        run: bash scripts/check-safe-production-migrations.sh "${{ github.event.before }}" "${{ github.sha }}"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/masters-runners/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE" -f apps/api/Dockerfile .
          docker push "$IMAGE"

      - name: Load migration URL from Secret Manager
        run: |
          DIRECT_URL=$(gcloud secrets versions access latest --secret=DIRECT_URL)
          echo "::add-mask::$DIRECT_URL"
          echo "DIRECT_URL=$DIRECT_URL" >> "$GITHUB_ENV"
          if [ -z "${DIRECT_URL}" ]; then
            echo "::error::Secret Manager secret DIRECT_URL must be set for automated ${DEPLOY_LANE} deploy migrations."
            exit 1
          fi

      - name: Run automated branch migrations and seed
        run: |
          pnpm db:migrate:deploy
          pnpm db:seed

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/masters-runners/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          env_vars=("NODE_ENV=production" "FRONTEND_URL=${FRONTEND_URL}")
          if [ -n "${API_PUBLIC_URL}" ]; then
            env_vars+=("API_PUBLIC_URL=${API_PUBLIC_URL}")
          fi
          if [ -n "${KAKAO_CALLBACK_URL}" ]; then
            env_vars+=("KAKAO_CALLBACK_URL=${KAKAO_CALLBACK_URL}")
          fi
          if [ -n "${GOOGLE_CALLBACK_URL}" ]; then
            env_vars+=("GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}")
          fi
          if [ -n "${NAVER_CALLBACK_URL}" ]; then
            env_vars+=("NAVER_CALLBACK_URL=${NAVER_CALLBACK_URL}")
          fi
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 4000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --set-env-vars "$(IFS=,; echo "${env_vars[*]}")" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,JWT_ACCESS_TTL=JWT_ACCESS_TTL:latest,JWT_REFRESH_TTL=JWT_REFRESH_TTL:latest,R2_ACCOUNT_ID=R2_ACCOUNT_ID:latest,R2_ACCESS_KEY_ID=R2_ACCESS_KEY_ID:latest,R2_SECRET_ACCESS_KEY=R2_SECRET_ACCESS_KEY:latest,R2_BUCKET_NAME=R2_BUCKET_NAME:latest,R2_PUBLIC_URL=R2_PUBLIC_URL:latest"

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.REGION }} --format 'value(status.url)')
          echo "Service URL: $URL"
          bash scripts/verify-deployment.sh "$URL"
