name: Codex Connector Execution Status

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to refresh"
        required: true
        type: string

concurrency:
  group: codex-pr-fix-status-${{ github.event.pull_request.number || github.event.pull_request_review.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  status:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow support
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Refresh connector execution status check
        uses: actions/github-script@v7
        env:
          HELPER_PATH: ${{ github.workspace }}/.github/scripts/pr-autofix-state.cjs
          STATE_MARKER: "<!-- codex-pr-fix-state -->"
        with:
          script: |
            const { findStateComment, parsePositiveInt, parseState } = require(process.env.HELPER_PATH);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const stateMarker = process.env.STATE_MARKER;

            async function loadPullRequest() {
              if (context.eventName === "workflow_dispatch") {
                const prNumber = parsePositiveInt(context.payload.inputs?.pr_number);
                if (!prNumber) {
                  core.setFailed("workflow_dispatch requires a positive integer pr_number input.");
                  return null;
                }

                const response = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber,
                });
                return response.data;
              }

              if (context.eventName === "issue_comment") {
                if (!context.payload.issue?.pull_request) {
                  return null;
                }

                const response = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: context.payload.issue.number,
                });
                return response.data;
              }

              if (context.eventName === "pull_request_review") {
                return context.payload.pull_request;
              }

              return context.payload.pull_request;
            }

            const pr = await loadPullRequest();
            if (!pr || pr.base.ref !== "dev") {
              core.info("No dev PR context for execution status refresh.");
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const stateComment = findStateComment(comments, stateMarker);
            const state = parseState(stateComment?.body || "", stateMarker);

            const statusMap = {
              waiting_for_connector_fix: { status: "completed", conclusion: "neutral" },
              running: { status: "in_progress" },
              succeeded: { status: "completed", conclusion: "success" },
              no_changes: { status: "completed", conclusion: "success" },
              paused: { status: "completed", conclusion: "neutral" },
              waiting_for_gemini_identity: { status: "completed", conclusion: "neutral" },
              waiting_for_gemini_review: { status: "completed", conclusion: "neutral" },
              retry_required: { status: "completed", conclusion: "neutral" },
              max_iterations_reached: { status: "completed", conclusion: "failure" },
              fork_blocked: { status: "completed", conclusion: "neutral" },
              untrusted_pr_author: { status: "completed", conclusion: "neutral" },
              protected_or_shared_head_branch: { status: "completed", conclusion: "failure" },
              failed: { status: "completed", conclusion: "failure" },
              unknown: { status: "completed", conclusion: "neutral" },
            };
            const checkState = statusMap[state.status || "unknown"] || statusMap.unknown;

            const summaryLines = [
              `Status: ${state.status || "unknown"}`,
              `Iteration: ${state.iteration || 0} / ${state.max_iterations || 5}`,
              `Gemini ready: ${state.gemini_review_ready ? "yes" : "no"}`,
              `Last result: ${state.last_result || "idle"}`,
              `Executor: ${state.executor || "chatgpt_codex_connector"}`,
            ];

            await github.rest.checks.create({
              owner,
              repo,
              name: "Codex Connector Execution Status",
              head_sha: pr.head.sha,
              status: checkState.status,
              ...(checkState.conclusion ? { conclusion: checkState.conclusion } : {}),
              output: {
                title: "Codex Connector Execution",
                summary: summaryLines.join("\n"),
              },
            });
