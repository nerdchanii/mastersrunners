name: Codex PR Fix Status

on:
  workflow_run:
    workflows: ["Codex PR Fix"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  publish-status:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Publish PR status comment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;

            let pr = (run.pull_requests || []).find((item) => item.base?.ref === 'dev');

            if (!pr && run.head_sha) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: run.head_sha,
              });
              pr = associated.data.find((item) => item.base.ref === 'dev');
            }

            if (!pr) {
              core.notice('No associated dev PR was found for this workflow run.');
              return;
            }

            const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: run.id,
            });
            const jobs = jobsResponse.data.jobs || [];
            const fixJob = jobs.find((job) => job.name === 'Codex Fix Skeleton');
            const resolveJob = jobs.find((job) => job.name === 'Resolve Request');

            let detail = 'No self-hosted fix job executed.';
            if (fixJob) {
              detail = `Self-hosted fix job conclusion: ${fixJob.conclusion || fixJob.status}.`;
            } else if (resolveJob) {
              detail = `Controller job conclusion: ${resolveJob.conclusion || resolveJob.status}.`;
            }

            const marker = '<!-- codex-pr-fix:status -->';
            const body = [
              marker,
              `Codex PR fix workflow ${run.conclusion || 'completed'}.`,
              detail,
              `Run: ${run.html_url}`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body,
            });
