name: Codex PR Fix

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: string
      request_id:
        description: "Gate-issued request identifier"
        required: true
        type: string
      head_ref:
        description: "PR head branch ref"
        required: true
        type: string
      head_sha:
        description: "PR head SHA"
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: codex-pr-fix-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  validate-request:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.validate.outputs.should_run }}
      pr_number: ${{ steps.validate.outputs.pr_number }}
      head_ref: ${{ steps.validate.outputs.head_ref }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
      reason: ${{ steps.validate.outputs.reason }}
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      REQUEST_ID: ${{ inputs.request_id }}
      HEAD_REF: ${{ inputs.head_ref }}
      HEAD_SHA: ${{ inputs.head_sha }}
      STATE_MARKER: "<!-- codex-pr-fix-state -->"
      COPILOT_REVIEW_LOGIN: ${{ vars.COPILOT_REVIEW_LOGIN }}
      GEMINI_REVIEW_LOGIN: ${{ vars.GEMINI_REVIEW_LOGIN }}
      COPILOT_REVIEW_MARKER: ${{ vars.COPILOT_REVIEW_MARKER }}
      GEMINI_REVIEW_MARKER: ${{ vars.GEMINI_REVIEW_MARKER }}
      FIX_LABEL: ai-fix
      MAX_ITERATIONS: "5"

    steps:
      - name: Checkout workflow support
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate workflow dispatch request
        id: validate
        uses: actions/github-script@v7
        env:
          HELPER_PATH: ${{ github.workspace }}/.github/scripts/pr-autofix-state.cjs
        with:
          script: |
            const {
              currentHeadReviewReady,
              findStateComment,
              latestCommand,
              parseState,
            } = require(process.env.HELPER_PATH);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.PR_NUMBER);
            const stateMarker = process.env.STATE_MARKER;
            const fixLabel = process.env.FIX_LABEL;
            const maxIterations = Number(process.env.MAX_ITERATIONS || "5");
            const copilotLogin = (process.env.COPILOT_REVIEW_LOGIN || "").trim().toLowerCase();
            const geminiLogin = (process.env.GEMINI_REVIEW_LOGIN || "").trim().toLowerCase();
            const copilotMarker = (process.env.COPILOT_REVIEW_MARKER || "").trim();
            const geminiMarker = (process.env.GEMINI_REVIEW_MARKER || "").trim();

            const prResponse = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issueNumber,
            });
            const pr = prResponse.data;
            const branchResponse = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: pr.head.ref,
            });
            const headBranch = branchResponse.data;
            const issueComments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const stateComment = findStateComment(issueComments, stateMarker);
            const state = parseState(stateComment?.body || "", stateMarker);
            const lastCommand = latestCommand(issueComments);
            let enabled = Boolean(state.enabled);

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: issueNumber,
              per_page: 100,
            });

            const geminiIdentityConfigured = Boolean(geminiLogin || geminiMarker);
            const copilotIdentityConfigured = Boolean(copilotLogin || copilotMarker);
            const copilotReady = currentHeadReviewReady(reviews, pr.head.sha, copilotLogin, copilotMarker);
            const geminiReady = currentHeadReviewReady(reviews, pr.head.sha, geminiLogin, geminiMarker);

            let reason = "ready";
            let shouldRun = true;
            if (pr.base.ref !== "dev") {
              shouldRun = false;
              reason = "not_dev";
            } else if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              shouldRun = false;
              reason = "fork_blocked";
            } else if (pr.author_association !== "OWNER") {
              shouldRun = false;
              reason = "untrusted_pr_author";
            } else if (["main", "dev"].includes(pr.head.ref) || headBranch.protected) {
              shouldRun = false;
              reason = "protected_or_shared_head_branch";
            } else if (pr.head.ref !== process.env.HEAD_REF || pr.head.sha !== process.env.HEAD_SHA) {
              shouldRun = false;
              reason = "stale_head";
            } else if (!enabled) {
              shouldRun = false;
              reason = "not_enabled";
            } else if (state.iteration >= maxIterations) {
              shouldRun = false;
              reason = "max_iterations_reached";
            } else if (!geminiIdentityConfigured) {
              shouldRun = false;
              reason = "waiting_for_gemini_identity";
            } else if (!copilotIdentityConfigured) {
              shouldRun = false;
              reason = "waiting_for_copilot_identity";
            } else if (!geminiReady) {
              shouldRun = false;
              reason = "waiting_for_gemini_review";
            } else if (!copilotReady) {
              shouldRun = false;
              reason = "waiting_for_copilot_review";
            } else if (state.last_request_id !== process.env.REQUEST_ID) {
              shouldRun = false;
              reason = "stale_request_id";
            } else if (state.last_requested_sha !== pr.head.sha) {
              shouldRun = false;
              reason = "request_not_queued";
            }

            core.setOutput("should_run", String(shouldRun));
            core.setOutput("pr_number", String(pr.number));
            core.setOutput("head_ref", pr.head.ref);
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("reason", reason);

      - name: Recover queued state when validation rejects request
        if: steps.validate.outputs.should_run != 'true'
        uses: actions/github-script@v7
        env:
          HELPER_PATH: ${{ github.workspace }}/.github/scripts/pr-autofix-state.cjs
        with:
          script: |
            const { findStateComment, parseState, renderState } = require(process.env.HELPER_PATH);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.PR_NUMBER);
            const stateMarker = process.env.STATE_MARKER;
            const headSha = process.env.HEAD_SHA;
            const requestId = process.env.REQUEST_ID;
            const reason = "${{ steps.validate.outputs.reason }}";

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const stateComment = findStateComment(comments, stateMarker);
            const previousState = parseState(stateComment?.body || "", stateMarker);

            const matchesActiveRequest =
              previousState.last_request_id === requestId ||
              (!previousState.last_request_id && previousState.last_requested_sha === headSha);
            if (!matchesActiveRequest) {
              return;
            }

            const statusByReason = {
              fork_blocked: "fork_blocked",
              untrusted_pr_author: "untrusted_pr_author",
              waiting_for_gemini_identity: "waiting_for_gemini_identity",
              waiting_for_copilot_identity: "waiting_for_copilot_identity",
              waiting_for_gemini_review: "waiting_for_gemini_review",
              waiting_for_copilot_review: "waiting_for_copilot_review",
              max_iterations_reached: "max_iterations_reached",
              not_enabled: "paused",
              protected_or_shared_head_branch: "failed",
              stale_head: "retry_required",
              stale_request_id: "retry_required",
              request_not_queued: "retry_required",
            };

            const nextState = {
              ...previousState,
              status: statusByReason[reason] || "failed",
              last_request_id: "",
              last_requested_sha: "",
              last_requested_at: "",
              last_result: reason || "validation_rejected",
              updated_at: new Date().toISOString(),
            };

            const body = renderState(nextState, stateMarker);
            if (stateComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: stateComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }

      - name: Refresh status workflow after rejected request
        if: steps.validate.outputs.should_run != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "codex-pr-fix-status.yml",
              ref: "dev",
              inputs: {
                pr_number: process.env.PR_NUMBER,
              },
            });

  fix:
    needs: validate-request
    if: needs.validate-request.outputs.should_run == 'true'
    runs-on: [self-hosted, macos, codex-runner]
    timeout-minutes: 45
    env:
      HELPER_PATH: ${{ runner.temp }}/pr-autofix-state.cjs
      PR_NUMBER: ${{ needs.validate-request.outputs.pr_number }}
      REQUEST_ID: ${{ inputs.request_id }}
      HEAD_REF: ${{ needs.validate-request.outputs.head_ref }}
      HEAD_SHA: ${{ needs.validate-request.outputs.head_sha }}
      STATE_MARKER: "<!-- codex-pr-fix-state -->"
      COPILOT_REVIEW_LOGIN: ${{ vars.COPILOT_REVIEW_LOGIN }}
      GEMINI_REVIEW_LOGIN: ${{ vars.GEMINI_REVIEW_LOGIN }}
      COPILOT_REVIEW_MARKER: ${{ vars.COPILOT_REVIEW_MARKER }}
      GEMINI_REVIEW_MARKER: ${{ vars.GEMINI_REVIEW_MARKER }}

    steps:
      - name: Checkout workflow support
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          path: _workflow_support

      - name: Stage shared workflow helper
        run: |
          cp "_workflow_support/.github/scripts/pr-autofix-state.cjs" "$RUNNER_TEMP/pr-autofix-state.cjs"
          rm -rf _workflow_support

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mark state as running
        id: state-start
        uses: actions/github-script@v7
        with:
          script: |
            const { findStateComment, parseState, renderState } = require(process.env.HELPER_PATH);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.PR_NUMBER);
            const stateMarker = process.env.STATE_MARKER;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const stateComment = findStateComment(comments, stateMarker);
            const previousState = parseState(stateComment?.body || "", stateMarker);
            const nextState = {
              ...previousState,
              iteration: Number(previousState.iteration || 0) + 1,
              status: "running",
              last_request_id: process.env.REQUEST_ID,
              last_requested_sha: process.env.HEAD_SHA,
              last_result: "running",
              updated_at: new Date().toISOString(),
            };

            const body = renderState(nextState, stateMarker);
            if (stateComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: stateComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }

            core.setOutput("iteration", String(nextState.iteration));

      - name: Collect AI review feedback
        id: feedback
        uses: actions/github-script@v7
        env:
          FEEDBACK_PATH: ${{ runner.temp }}/ai-review-feedback.md
        with:
          script: |
            const fs = require("fs");
            const { reviewMatches } = require(process.env.HELPER_PATH);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.PR_NUMBER);
            const headSha = process.env.HEAD_SHA;
            const copilotLogin = (process.env.COPILOT_REVIEW_LOGIN || "").trim().toLowerCase();
            const geminiLogin = (process.env.GEMINI_REVIEW_LOGIN || "").trim().toLowerCase();
            const copilotMarker = (process.env.COPILOT_REVIEW_MARKER || "").trim();
            const geminiMarker = (process.env.GEMINI_REVIEW_MARKER || "").trim();
            const feedbackPath = process.env.FEEDBACK_PATH;

            const prResponse = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issueNumber,
            });
            const pr = prResponse.data;

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: issueNumber,
              per_page: 100,
            });
            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner,
              repo,
              pull_number: issueNumber,
              per_page: 100,
            });

            const filteredReviews = reviews.filter((review) => {
              if (review.state === "DISMISSED") {
                return false;
              }
              if (review.commit_id !== headSha) {
                return false;
              }
              return (
                reviewMatches(review, copilotLogin, copilotMarker) ||
                reviewMatches(review, geminiLogin, geminiMarker)
              );
            });

            const filteredComments = reviewComments.filter((comment) => {
              if (comment.commit_id !== headSha && comment.original_commit_id !== headSha) {
                return false;
              }
              return (
                reviewMatches(comment, copilotLogin, copilotMarker) ||
                reviewMatches(comment, geminiLogin, geminiMarker)
              );
            });

            const sections = [];
            if (filteredReviews.length > 0) {
              sections.push("## Review Summaries");
              for (const review of filteredReviews) {
                sections.push(`- ${review.user?.login || "unknown"} (${review.state}): ${review.body || "(no body)"}`);
              }
            }

            if (filteredComments.length > 0) {
              sections.push("", "## Review Comments");
              for (const comment of filteredComments) {
                sections.push(`- ${comment.user?.login || "unknown"} on ${comment.path || "unknown"}: ${comment.body || "(no body)"}`);
              }
            }

            const body = [
              `# PR #${pr.number}: ${pr.title}`,
              "",
              "Address the AI review findings below for the current PR head commit.",
              "Follow AGENTS.md, keep changes on the checked-out PR branch, and do not weaken approved design docs.",
              "",
              ...sections,
              "",
            ].join("\n");

            fs.writeFileSync(feedbackPath, body, "utf8");
            core.setOutput("has_feedback", sections.length > 0 ? "true" : "false");

      - name: Build Codex prompt
        if: steps.feedback.outputs.has_feedback == 'true'
        run: |
          cat > "$RUNNER_TEMP/codex-pr-fix-prompt.md" <<'EOF'
          You are fixing AI review feedback for the checked-out pull request branch in the mastersrunners repository.

          Requirements:
          - Follow AGENTS.md and the repository harness rules.
          - Work only within the current PR branch.
          - Do not change protected branch policy or bypass review requirements.
          - Keep approved design and domain docs intact. If the code diverges from approved design and you cannot resolve it within this changeset, surface it in your final message instead of weakening the docs.
          - Apply the AI review findings from the attached feedback file.
          - After changes, run the repository verification steps requested by the workflow.
          - If no code changes are needed, say so clearly in the final message.
          EOF

      - name: Run Codex auto-fix
        id: codex
        if: steps.feedback.outputs.has_feedback == 'true'
        continue-on-error: true
        run: |
          cat "$RUNNER_TEMP/ai-review-feedback.md" >> "$RUNNER_TEMP/codex-pr-fix-prompt.md"
          codex -a never -s workspace-write exec -C "$GITHUB_WORKSPACE" --output-last-message "$RUNNER_TEMP/codex-last-message.txt" - < "$RUNNER_TEMP/codex-pr-fix-prompt.md"

      - name: Run lint
        id: lint
        if: steps.feedback.outputs.has_feedback == 'true'
        continue-on-error: true
        run: pnpm lint

      - name: Run explicit typecheck
        id: typecheck
        if: steps.feedback.outputs.has_feedback == 'true'
        continue-on-error: true
        run: pnpm typecheck

      - name: Detect code changes
        id: diff
        run: |
          if [ -n "$(git status --short)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify PR branch head is unchanged
        id: branch-head
        if: steps.feedback.outputs.has_feedback == 'true' && steps.codex.outcome == 'success' && steps.lint.outcome == 'success' && steps.typecheck.outcome == 'success'
        run: |
          REMOTE_SHA="$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk '{print $1}')"
          if [ -z "$REMOTE_SHA" ]; then
            echo "Expected remote branch ${HEAD_REF} to exist." >&2
            exit 1
          fi
          if [ "$REMOTE_SHA" != "$HEAD_SHA" ]; then
            echo "PR head moved from ${HEAD_SHA} to ${REMOTE_SHA}; refusing to push stale autofix." >&2
            exit 1
          fi
          echo "remote_sha=$REMOTE_SHA" >> "$GITHUB_OUTPUT"

      - name: Confirm auto-fix still enabled before push
        id: stop-check
        if: steps.feedback.outputs.has_feedback == 'true' && steps.codex.outcome == 'success' && steps.lint.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.branch-head.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { findStateComment, parseState } = require(process.env.HELPER_PATH);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.PR_NUMBER);
            const stateMarker = process.env.STATE_MARKER;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const stateComment = findStateComment(comments, stateMarker);
            const state = parseState(stateComment?.body || "", stateMarker);
            const stillEnabled =
              Boolean(state.enabled) &&
              state.last_request_id === process.env.REQUEST_ID &&
              state.head_sha === process.env.HEAD_SHA;

            core.setOutput("still_enabled", String(stillEnabled));
            if (!stillEnabled) {
              core.setFailed("Auto-fix was disabled or superseded before push.");
            }

      - name: Commit and push PR autofix
        id: push
        if: steps.feedback.outputs.has_feedback == 'true' && steps.codex.outcome == 'success' && steps.lint.outcome == 'success' && steps.typecheck.outcome == 'success' && steps.diff.outputs.has_changes == 'true' && steps.branch-head.outcome == 'success' && steps.stop-check.outputs.still_enabled == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(repo): address AI PR review feedback" \
            -m "PR: #${PR_NUMBER}" \
            -m "Autofix-Iteration: ${{ steps.state-start.outputs.iteration }}"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk '{print $1}')"
          if [ "$REMOTE_SHA" != "$HEAD_SHA" ]; then
            echo "PR head moved from ${HEAD_SHA} to ${REMOTE_SHA}; aborting push." >&2
            exit 1
          fi
          git push origin "HEAD:${HEAD_REF}"
          echo "pushed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Finalize PR state
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { findStateComment, parseState, renderState } = require(process.env.HELPER_PATH);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = Number(process.env.PR_NUMBER);
            const stateMarker = process.env.STATE_MARKER;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const stateComment = findStateComment(comments, stateMarker);
            const previousState = parseState(stateComment?.body || "", stateMarker);

            let status = "no_changes";
            let lastResult = "no_changes";
            if ("${{ steps.feedback.outputs.has_feedback }}" !== "true") {
              status = "no_changes";
              lastResult = "no_feedback";
            } else if ("${{ steps.codex.outcome }}" !== "success") {
              status = "failed";
              lastResult = "codex_failed";
            } else if ("${{ steps.lint.outcome }}" !== "success") {
              status = "failed";
              lastResult = "lint_failed";
            } else if ("${{ steps.typecheck.outcome }}" !== "success") {
              status = "failed";
              lastResult = "typecheck_failed";
            } else if ("${{ steps.diff.outputs.has_changes }}" !== "true") {
              status = "no_changes";
              lastResult = "no_changes";
            } else if ("${{ steps.stop-check.outputs.still_enabled }}" !== "true") {
              status = "paused";
              lastResult = "stopped_before_push";
            } else if ("${{ steps.push.outcome }}" !== "success") {
              status = "failed";
              lastResult = "push_failed";
            } else {
              status = "succeeded";
              lastResult = "succeeded";
            }

            const nextState = {
              ...previousState,
              status,
              last_request_id: process.env.REQUEST_ID,
              last_result: lastResult,
              last_fix_completed_at: new Date().toISOString(),
              last_fixed_sha: "${{ steps.push.outputs.pushed_sha || env.HEAD_SHA }}",
              updated_at: new Date().toISOString(),
            };

            const body = renderState(nextState, stateMarker);
            if (stateComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: stateComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }

      - name: Refresh status workflow
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "codex-pr-fix-status.yml",
              ref: "dev",
              inputs: {
                pr_number: process.env.PR_NUMBER,
              },
            });
